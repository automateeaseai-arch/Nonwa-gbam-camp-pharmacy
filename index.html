<button id="upd" hidden style="width:100%;border:0;background:#fff4d6;color:#8a5a00;padding:10px 14px;font:600 14px system-ui;cursor:pointer;text-align:left">A new version of the app is ready — tap here to update</button>
<main id="app"></main>

<script>
const hideSplash = () => { const sp = document.getElementById('splash'); if (!sp) return; sp.classList.add('out'); setTimeout(() => sp.remove(), 500); };
setTimeout(hideSplash, 6000); // safety net: never leave the loading page up if something below fails
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
function toast(msg) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function ask(msg, okLabel) {
  return new Promise(res => {
    const o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px';
    o.innerHTML = `<div class="card" style="max-width:360px;margin:0"><p style="margin-top:0">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-a="0">Cancel</button><button class="btn danger" data-a="1">${esc(okLabel || 'Delete')}</button></div></div>`;
    o.onclick = e => { const a = e.target.dataset && e.target.dataset.a; if (a !== undefined || e.target === o) { o.remove(); res(a === '1'); } };
    document.body.appendChild(o);
  });
}
function askTyped(msg, word, okLabel) { // for actions that cannot be undone: the word must be typed
  return new Promise(res => {
    const o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px';
    o.innerHTML = `<div class="card" style="max-width:380px;margin:0"><p style="margin-top:0">${esc(msg)}</p><label>Type ${word} to confirm</label><input id="tw" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" data-a="0">Cancel</button><button class="btn danger" data-a="1">${esc(okLabel)}</button></div></div>`;
    o.onclick = e => { const a = e.target.dataset && e.target.dataset.a;
      if (a === '1') { if (o.querySelector('#tw').value.trim().toUpperCase() !== word) return toast('Type ' + word + ' to confirm'); o.remove(); res(true); }
      else if (a === '0' || e.target === o) { o.remove(); res(false); } };
    document.body.appendChild(o);
  });
}
function stable(v) { // JSON with sorted keys, for comparing records
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v ?? null);
}

/* ---------- local storage on this device (IndexedDB, falls back to localStorage) ---------- */
const Store = {
  db: null, mem: false, // mem = this browser view cannot store anything; records live only until the page closes
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        setTimeout(() => rej(new Error('timeout')), 3000);
        const r = indexedDB.open('campPharmacy', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('patients', { keyPath: 'id' }); r.result.createObjectStore('meta'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
    if (!this.db) { try { localStorage.setItem('cp_test', '1'); localStorage.removeItem('cp_test'); } catch (e) { this.mem = true; } }
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const rq = fn(t.objectStore(store)); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); });
  },
  async all() {
    if (this.mem) return [];
    if (this.db) return this.tx('patients', 'readonly', s => s.getAll());
    try { return Object.values(JSON.parse(localStorage.getItem('cp_patients') || '{}')); } catch (e) { return []; }
  },
  async put(p) {
    if (this.mem) return;
    try {
      if (this.db) return await this.tx('patients', 'readwrite', s => s.put(p));
      const m = {}; patients.forEach(x => m[x.id] = x); localStorage.setItem('cp_patients', JSON.stringify(m));
    } catch (e) { this.mem = true; showStatus(); }
  },
  async getMeta(k) {
    if (this.mem) return null;
    if (this.db) return this.tx('meta', 'readonly', s => s.get(k));
    try { return JSON.parse(localStorage.getItem('cp_meta_' + k)); } catch (e) { return null; }
  },
  async setMeta(k, v) {
    if (this.mem) return;
    try {
      if (this.db) return await this.tx('meta', 'readwrite', s => s.put(v, k));
      localStorage.setItem('cp_meta_' + k, JSON.stringify(v));
    } catch (e) { this.mem = true; }
  },
  async clearPatients() {
    if (this.mem) return;
    try { if (this.db) return await this.tx('patients', 'readwrite', s => s.clear()); localStorage.removeItem('cp_patients'); } catch (e) {}
  }
};

/* ---------- state ---------- */
const patients = new Map();
const SB_URL = 'https://iayenvzflbubhzbjctfx.supabase.co';
const SB_KEY = 'sb_publishable_ozj-IovD0dHK235k1PNyjg_e35kZcXk'; // public key: safe in the app; the database rules decide access
let S = { staff: '', lastSync: 0, lastSyncAt: 0, session: null, me: null };
let view = { name: 'home', q: '' };
let syncing = false, syncError = '';

const clean = p => { const { _dirty, _rev, ...rest } = p; return rest; };
const live = () => [...patients.values()].filter(p => !p.deleted);
const isAdmin = () => !!(S.me && S.me.admin); // only admins may delete a patient or a prescription (the database enforces it too)
const dirtyCount = () => [...patients.values()].filter(p => p._dirty).length;

async function saveLocal(p, touchDetails) {
  if (touchDetails) p.updatedAt = Date.now();
  p._dirty = true; p._rev = (p._rev || 0) + 1;
  patients.set(p.id, p);
  await Store.put(p);
  showStatus(); queueSync();
}

/* ---------- sync ---------- */
function mergePatient(a, b) {
  const base = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b;
  const map = new Map();
  for (const e of [...(a.entries || []), ...(b.entries || [])]) { const x = map.get(e.id); if (!x || (e.updatedAt || 0) > (x.updatedAt || 0)) map.set(e.id, e); }
  return { ...clean(base), entries: [...map.values()].sort((x, y) => x.id < y.id ? -1 : 1) };
}
async function applyRemote(records) {
  let changed = false;
  for (const raw of records || []) {
    let r; try { r = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { continue; }
    if (!r || !r.id) continue;
    r.entries = (r.entries || []).sort((x, y) => x.id < y.id ? -1 : 1);
    const local = patients.get(r.id);
    let next;
    if (!local) next = { ...r, _dirty: false, _rev: 0 };
    else {
      const m = mergePatient(local, r);
      const same = stable(m) === stable(clean(r));
      next = { ...m, _dirty: !same, _rev: (local._rev || 0) + (same ? 0 : 1) };
      if (stable(m) === stable(mergePatient(local, local))) { if (same) { local._dirty = false; await Store.put(local); } continue; }
    }
    patients.set(next.id, next); await Store.put(next); changed = true;
  }
  return changed;
}
/* Supabase: plain fetch calls, no library, so the app keeps working offline */
class AuthError extends Error {}
async function sb(path, opt = {}, auth = true, retried = false) {
  const h = { apikey: SB_KEY, 'Content-Type': 'application/json', ...(opt.headers || {}) };
  if (auth) h.Authorization = 'Bearer ' + await token();
  const r = await fetch(SB_URL + path, { ...opt, headers: h });
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (r.ok) return j;
  const msg = (j && (j.msg || j.message || j.error_description || j.error)) || 'Error ' + r.status;
  if (auth && r.status === 401 && !retried) { S.session.expires_at = 0; return sb(path, opt, auth, true); }
  throw (r.status === 401 || (!auth && r.status === 400)) ? new AuthError(msg) : new Error(msg);
}
async function signIn(body, grant) {
  const j = await sb('/auth/v1/token?grant_type=' + grant, { method: 'POST', body: JSON.stringify(body) }, false);
  S.session = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Date.now() / 1000 + (j.expires_in || 3600), email: (j.user && j.user.email) || (S.session && S.session.email) };
  await Store.setMeta('settings', S);
}
let refreshing = null;
async function token() {
  if (!S.session || S.session.expired) throw new AuthError('Signed out');
  if (S.session.expires_at - 60 > Date.now() / 1000) return S.session.access_token;
  if (!refreshing) refreshing = signIn({ refresh_token: S.session.refresh_token }, 'refresh_token').finally(() => { refreshing = null; });
  try { await refreshing; }
  catch (e) { if (e instanceof AuthError) { S.session.expired = true; await Store.setMeta('settings', S); } throw e; }
  return S.session.access_token;
}
async function loadMe() {
  const rows = await sb('/rest/v1/staff?select=name,is_admin&email=eq.' + encodeURIComponent(S.session.email));
  if (!rows || !rows.length) throw new Error('This account is not on the staff list. Ask the pharmacy admin to add ' + S.session.email);
  S.me = { email: S.session.email, name: rows[0].name, admin: rows[0].is_admin };
  if (!S.staff) S.staff = rows[0].name || S.session.email;
  await Store.setMeta('settings', S);
}
async function pull(since) {
  const out = []; let max = since;
  for (let off = 0; ; off += 1000) {
    const rows = await sb(`/rest/v1/patients?select=data,server_ts&server_ts=gt.${since}&order=server_ts.asc,id.asc&limit=1000&offset=${off}`);
    rows.forEach(r => { out.push(r.data); max = Math.max(max, +r.server_ts); });
    if (rows.length < 1000) return { records: out, max };
  }
}
const OVERLAP = 120000; // re-read the last 2 minutes each time, so a slow upload from another phone is never skipped
async function sync(manual) {
  if (!S.session) { if (manual) toast('Sign in first'); return; }
  if (S.session.expired) { if (manual) { toast('Sign in again to sync'); go({ name: 'settings' }); } return; }
  if (syncing) return;
  if (!navigator.onLine) { if (manual) toast('No internet. Records are safe on this device and will sync later.'); showStatus(); return; }
  syncing = true; syncError = ''; showStatus();
  try {
    // Has the admin cleared all records for a new camp since this phone last synced? Then clear them here too.
    let epoch = null, changed = false;
    try { const c = await sb('/rest/v1/camp?select=epoch'); if (c && c[0]) epoch = +c[0].epoch; } catch (e) { if (e instanceof AuthError) throw e; }
    if (epoch !== null) {
      if (S.epoch != null && S.epoch !== epoch) { patients.clear(); await Store.clearPatients(); S.lastSync = 0; changed = true; toast('All records were cleared by the admin for a new camp'); }
      S.epoch = epoch;
    }
    let r = await pull(Math.max(0, (S.lastSync || 0) - OVERLAP)), max = r.max;
    changed = (await applyRemote(r.records)) || changed;
    const dirty = [...patients.values()].filter(p => p._dirty);
    if (dirty.length) {
      for (let i = 0; i < dirty.length; i += 50) {
        const part = dirty.slice(i, i + 50), revs = new Map(part.map(p => [p.id, p._rev]));
        await sb('/rest/v1/rpc/sync_push', { method: 'POST', body: JSON.stringify(epoch === null ? { changes: part.map(clean) } : { changes: part.map(clean), client_epoch: epoch }) });
        for (const p of part) { const cur = patients.get(p.id); if (cur && cur._rev === revs.get(p.id)) { cur._dirty = false; await Store.put(cur); } }
      }
      r = await pull(Math.max(0, max - OVERLAP)); max = Math.max(max, r.max); // get back the merged versions
      changed = (await applyRemote(r.records)) || changed;
    }
    S.lastSync = max; S.lastSyncAt = Date.now(); await Store.setMeta('settings', S);
    if (changed) refreshDrugs();
    if (changed && !document.activeElement.matches('input,textarea,select')) render();
    if (manual) toast('Synced');
  } catch (e) {
    syncError = e instanceof TypeError ? 'cannot reach the server' : (e.message || String(e));
    if (manual) toast('Sync failed: ' + syncError);
  }
  finally { syncing = false; showStatus(); }
}
let syncTimer;
function queueSync() { clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(false), 4000); }
window.addEventListener('online', () => sync(false));
window.addEventListener('offline', showStatus);
let lastSess = null; setInterval(() => { const k = today() + nowSess(); if (lastSess && k !== lastSess && !document.activeElement.matches('input,textarea,select')) render(); lastSess = k; }, 30000);
setInterval(() => { if (navigator.onLine && S.session && !S.session.expired && (dirtyCount() || Date.now() - S.lastSyncAt > 3 * 60000)) sync(false); }, 45000);

function showStatus() {
  const el = $('#status'), n = dirtyCount(); let cls = '', t;
  const wait = n ? ` · ${n} record${n > 1 ? 's' : ''} waiting to upload` : '';
  $('#memwarn').hidden = !Store.mem;
  if (syncing) { cls = 'pending'; t = 'Syncing…'; }
  else if (!S.session) { t = 'Not signed in'; cls = 'pending'; }
  else if (S.session.expired) { cls = 'err'; t = 'Signed out — tap here to sign in again and sync' + wait; }
  else if (!navigator.onLine) { cls = 'pending'; t = 'Offline — saved on this device' + wait; }
  else if (syncError) { cls = 'err'; t = 'Sync problem: ' + syncError + wait; }
  else if (n) { cls = 'pending'; t = 'Saved on this device' + wait; }
  else { cls = 'ok'; t = 'All records backed up to cloud' + (S.lastSyncAt ? ' · ' + new Date(S.lastSyncAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''); }
  el.className = cls; $('#statusText').textContent = t;
  el.onclick = S.session && S.session.expired ? () => go({ name: 'settings' }) : null; el.style.cursor = el.onclick ? 'pointer' : '';
}

/* ---------- schedule logic ---------- */
const SESS = ['Morning', 'Afternoon', 'Night'];
const nowSess = () => { const h = new Date().getHours(); return h < 12 ? 0 : h < 17 ? 1 : 2; };
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return t.toISOString().slice(0, 10); };
const cmpSlot = (a, b) => a.date === b.date ? a.s - b.s : (a.date < b.date ? -1 : 1);
const items = (p, t) => (p.entries || []).filter(e => e.t === t && !e.deleted);
const timesOf = d => SESS.map((x, i) => i).filter(i => (d.times || []).includes(SESS[i]));
const totalOf = d => Math.min(200, Math.max(0, Math.round(+d.days || 0) * timesOf(d).length));
// Every dose has a fixed place: a date and a session. The schedule moves on whether or not a dose was collected.
function slots(d) {
  const times = timesOf(d), total = totalOf(d), out = [];
  if (!times.length || !d.startDate) return out;
  let date = d.startDate, first = true, guard = 0;
  while (out.length < total && guard++ < 400) {
    for (const s of times) { if (first && s < (d.startSession || 0)) continue; if (out.length < total) out.push({ date, s }); }
    first = false; date = addDays(date, 1);
  }
  return d.stopped ? out.filter(x => cmpSlot(x, { date: d.stopDate, s: d.stopSession }) < 0) : out;
}
const doseId = (d, x) => d.id + '|' + x.date + '|' + x.s;
function status(p, d) {
  const given = new Set(items(p, 'dose').map(e => e.id)), now = { date: today(), s: nowSess() };
  const st = slots(d).map(x => { const c = cmpSlot(x, now); return { ...x, state: given.has(doseId(d, x)) ? 'given' : c < 0 ? 'missed' : c === 0 ? 'due' : 'up' }; });
  const n = k => st.filter(x => x.state === k).length;
  return { st, total: totalOf(d), taken: n('given'), missed: n('missed'), left: n('due') + n('up'), due: st.find(x => x.state === 'due'), next: st.find(x => x.state === 'up'),
    givenNow: st.find(x => x.state === 'given' && cmpSlot(x, now) === 0) };
}
async function setDose(p, d, x, give) {
  const id = doseId(d, x); let e = (p.entries || []).find(z => z.id === id);
  if (e) { e.deleted = !give; e.updatedAt = Date.now(); if (give) { e.by = S.staff || ''; e.at = Date.now(); } }
  else if (give) p.entries.push({ id, t: 'dose', drugId: d.id, date: x.date, s: x.s, by: S.staff || '', at: Date.now(), updatedAt: Date.now() });
  await saveLocal(p, false);
}
const dayLabel = date => date === today() ? 'today' : date === addDays(today(), 1) ? 'tomorrow' : 'on ' + fmtDate(date);
const drugName = d => esc(d.drug) + (d.dose ? ' <span class="mut">' + esc(d.dose) + '</span>' : '');

/* ---------- views ---------- */
const COMMON = ['Tab Paracetamol 500mg', 'Tab Ibuprofen 400mg', 'Tab Diclofenac 50mg', 'Tab Artemether/Lumefantrine 80/480mg', 'Cap Amoxicillin 500mg', 'Tab Amoxicillin/Clavulanate 625mg', 'Tab Ciprofloxacin 500mg', 'Tab Metronidazole 400mg', 'Tab Azithromycin 500mg', 'Tab Loratadine 10mg', 'Tab Cetirizine 10mg', 'Tab Chlorpheniramine 4mg', 'Cap Omeprazole 20mg', 'Susp Antacid', 'Tab Hyoscine butylbromide 10mg', 'Cap Loperamide 2mg', 'ORS sachet', 'Tab Zinc 20mg', 'Tab Vitamin C 100mg', 'Syr Cough mixture', 'Salbutamol inhaler', 'Tab Prednisolone 5mg'];
function refreshDrugs() {
  const set = new Set(COMMON);
  patients.forEach(p => items(p, 'drug').forEach(e => e.drug && set.add(e.drug)));
  $('#drugs').innerHTML = [...set].sort().map(d => `<option value="${esc(d)}">`).join('');
}
// State codes always look like RV/26C/1234: "RV/" and the second "/" are fixed; staff type the batch (26C) and the number.
const defBatch = () => { // the batch this phone used last, or the most common one on record
  if (S.batch) return S.batch;
  const n = {}; live().forEach(p => { const m = p.id.match(/^RV(\d{2}[A-Z])\d+$/); if (m) n[m[1]] = (n[m[1]] || 0) + 1; });
  return Object.keys(n).sort((a, b) => n[b] - n[a])[0] || '';
};
function go(v) { view = v; render(); window.scrollTo(0, 0); }
function render() {
  if (!S.session) return renderLogin();
  if (view.name === 'patient') return renderPatient();
  if (view.name === 'settings') return renderSettings();
  if (view.name === 'report') return renderReport();
  renderHome();
}
// By number: matches the digits anywhere in the number part of the code. Exact code first, then this batch, then the rest.
function searchCode(fullId, batch, digits) {
  const numOf = id => id.replace(/^RV\d{2}[A-Z]/, ''), rank = p => p.id === fullId ? 0 : p.id.startsWith('RV' + batch) ? 1 : 2;
  return live().filter(p => numOf(p.id).includes(digits))
    .sort((a, b) => rank(a) - rank(b) || (b.id.endsWith(digits) - a.id.endsWith(digits)) || a.id.localeCompare(b.id)).slice(0, 30);
}
function searchName(name) {
  const n = name.toLowerCase();
  return live().filter(p => (p.name || '').toLowerCase().includes(n)).sort((a, b) => (a.name || '').localeCompare(b.name || '')).slice(0, 30);
}
// who is expected in a given session today
function sessionList(s) {
  const t = today(), out = [];
  live().forEach(p => {
    const given = new Set(items(p, 'dose').map(e => e.id)); const ds = [];
    items(p, 'drug').forEach(d => { const x = slots(d).find(x => x.date === t && x.s === s); if (x) ds.push({ d, done: given.has(doseId(d, x)) }); });
    if (ds.length) out.push({ p, ds, pending: ds.filter(x => !x.done).length });
  });
  return out.sort((a, b) => (b.pending > 0) - (a.pending > 0) || a.p.id.localeCompare(b.p.id));
}
function renderHome() {
  const all = live(), cur = nowSess(), vs = view.sess ?? cur;
  const list = sessionList(vs), pend = list.filter(x => x.pending).length;
  $('#app').innerHTML = `
    <div class="card">
      <label for="q">State code: batch (e.g. 26C), then the 4-digit number</label>
      <div class="codebox"><b class="code">RV/</b><input id="qb" maxlength="3" placeholder="___" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(view.qb ?? defBatch())}"><b class="code">/</b><input id="q" inputmode="numeric" maxlength="4" placeholder="____" autocomplete="off" value="${esc(view.q || '')}"></div>
      <div class="fld"><label for="qn">or search by name</label><input id="qn" autocomplete="off" spellcheck="false" value="${esc(view.qn || '')}"></div>
      <div id="results"></div>
    </div>
    <div class="card"><h2>Expected today</h2>
      <div class="tabs">${SESS.map((n, i) => `<button class="tab ${i === vs ? 'on' : ''}" data-sess="${i}">${n}${i === cur ? ' (now)' : ''}</button>`).join('')}</div>
      <p class="mut" style="margin:10px 0 0">${list.length ? `${list.length} patient${list.length > 1 ? 's' : ''} expected · ${pend} still to ${vs < cur ? 'collect (missed)' : 'collect'}` : 'Nobody is scheduled for this session.'}</p>
      ${list.map(x => `<button class="res" data-id="${esc(x.p.id)}"><span><span class="code">${esc(x.p.code)}</span> &nbsp;${esc(x.p.name || '')}<br><span class="mut">${x.ds.map(z => (z.done ? '✓ ' : '') + esc(z.d.drug)).join(', ')}</span></span>
        <span class="badge ${x.pending ? (vs < cur ? 'miss' : 'due') : 'ok'}">${x.pending ? (vs < cur ? x.pending + ' missed' : x.pending + ' to give') : '✓ given'}</span></button>`).join('')}
    </div>
    <div class="card stats"><div><b>${all.length}</b><span class="mut">patients on record</span></div><div><b>${all.filter(p => items(p, 'drug').some(d => status(p, d).left)).length}</b><span class="mut">currently on drugs</span></div><span style="flex:1"></span><button class="btn ghost" id="toRep" style="align-self:center">Reports</button></div>`;
  const q = $('#q'), qb = $('#qb'), qn = $('#qn');
  $('#toRep').onclick = () => go({ name: 'report' });
  const open = () => document.querySelectorAll('.res').forEach(b => b.onclick = () => go({ name: 'patient', id: b.dataset.id }));
  let res = [];
  const draw = () => {
    const digits = q.value.replace(/\D/g, '').slice(0, 4); if (q.value !== digits) q.value = digits; // numbers only
    const batch = norm(qb.value).slice(0, 3), name = qn.value.trim(), okBatch = /^\d{2}[A-Z]$/.test(batch);
    Object.assign(view, { q: digits, qb: qb.value, qn: qn.value });
    const num = digits.padStart(4, '0'), newId = 'RV' + batch + num, exact = okBatch && patients.get(newId);
    res = digits ? searchCode(newId, batch, digits) : name.length > 1 ? searchName(name) : [];
    const canAdd = digits && okBatch && !(exact && !exact.deleted) && (!res.length || digits.length === 4);
    const none = res.length ? '' : digits ? (okBatch ? 'No patient with this number. First visit? Register below.' : 'No patient with this number. To register, fill in the batch first (two digits and a letter, e.g. 26C).')
      : name.length > 1 ? `No patient found for “${esc(name)}”. To register a new patient, type their state code above.` : '';
    $('#results').innerHTML = res.map(p => {
      const act = items(p, 'drug').filter(d => status(p, d).left), due = act.filter(d => status(p, d).due).length;
      return `<button class="res" data-id="${esc(p.id)}"><span><span class="code">${esc(p.code)}</span> &nbsp;${esc(p.name || '')}${p.allergies ? ' <span style="color:var(--warn)">⚠ allergy</span>' : ''}<br><span class="mut">${act.length ? 'On: ' + act.map(d => esc(d.drug)).join(', ') : 'Not on any drug now'}</span></span>${due ? `<span class="badge due">${due} due now</span>` : '<span class="mut">Open ›</span>'}</button>`;
    }).join('') + (none ? `<p class="mut">${none}</p>` : '')
      + (canAdd ? `<div class="row" style="margin-top:10px"><button class="btn" id="addNew">+ Register new patient RV/${esc(batch)}/${num}</button></div>` : '');
    open();
    const a = $('#addNew'); if (a) a.onclick = () => go({ name: 'patient', id: newId, batch, num, mode: 'edit' });
  };
  const enter = e => { if (e.key !== 'Enter') return; if (res.length === 1) go({ name: 'patient', id: res[0].id }); else if ($('#addNew')) $('#addNew').click(); };
  [q, qb, qn].forEach(el => { el.oninput = draw; el.onkeydown = enter; });
  qb.addEventListener('input', () => { if (norm(qb.value).length === 3) q.focus(); }); // batch complete: jump to the number
  document.querySelectorAll('[data-sess]').forEach(b => b.onclick = () => { view.sess = +b.dataset.sess; render(); });
  draw(); open(); if (!view.sess && view.sess !== 0) (qb.value ? q : qb).focus();
}

function drugCard(p, d) {
  const s = status(p, d), pct = s.total ? Math.round(100 * s.taken / s.total) : 0;
  const state = d.stopped ? 'Stopped' : !s.left ? 'Course finished' : '';
  let last = '';
  const dots = s.st.map(x => { const gap = last && last !== x.date; last = x.date; return `${gap ? '<span class="gap"></span>' : ''}<button class="dot ${x.state}" data-drug="${d.id}" data-date="${x.date}" data-s="${x.s}" title="${fmtDate(x.date)} ${SESS[x.s]}">${x.state === 'given' ? '✓' : 'MAN'[x.s]}</button>`; }).join('');
  return `<div class="drugc"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="drug">${drugName(d)}</div>
    <div class="mut">${timesOf(d).map(i => SESS[i]).join(' · ')} × ${esc(d.days)} day${d.days == 1 ? '' : 's'}${state ? ` · <b>${state}</b>` : ''}</div></div><button class="link" data-editdrug="${d.id}">Edit</button></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="count"><b>${s.taken} of ${s.total}</b> doses taken${s.missed ? ` · <span style="color:var(--warn)">${s.missed} missed</span>` : ''} · ${s.left} left</div>
    <div class="dots">${dots}</div></div>`;
}
function renderPatient() {
  let p = patients.get(view.id);
  const isNew = !p || p.deleted;
  if (isNew) p = { id: view.id, code: '', name: '', sex: '', platoon: '', phone: '', allergies: '', entries: (p && p.entries) || [], createdAt: Date.now() };
  const mode = isNew ? 'edit' : view.mode || '';
  const rxs = items(p, 'rx').sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.createdAt - a.createdAt);
  const drugs = items(p, 'drug'), cur = nowSess();
  const back = () => go({ name: 'patient', id: p.id });
  let h = `<div class="row" style="margin-bottom:10px"><button class="btn ghost" id="back">‹ Search</button></div>`;

  if (mode === 'edit') {
    h += `<form class="card" id="pf"><h2>${isNew ? 'Register new patient' : 'Edit patient details'}</h2><div class="grid">
      ${isNew ? `<div class="wide"><label>State code: batch (e.g. 26C), then the 4-digit number</label><div class="row" style="flex-wrap:nowrap;gap:6px"><b class="code" style="font-size:18px">RV/</b><input name="batch" value="${esc(view.batch || defBatch())}" maxlength="3" placeholder="___" autocapitalize="characters" autocomplete="off" required class="batch" style="text-transform:uppercase"><b class="code" style="font-size:18px">/</b><input name="num" value="${esc(view.num || '')}" inputmode="numeric" maxlength="4" placeholder="____" autocomplete="off" required style="min-width:5em"></div></div>`
        : `<div><label>State code</label><input name="code" value="${esc(p.code)}" readonly></div>`}
      <div><label>Full name</label><input name="name" value="${esc(p.name)}" required></div>
      <div><label>Sex</label><select name="sex"><option value=""></option>${['M', 'F'].map(s => `<option ${p.sex === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div><label>Platoon</label><input name="platoon" value="${esc(p.platoon)}"></div>
      <div><label>Phone</label><input name="phone" inputmode="tel" value="${esc(p.phone)}"></div>
      <div class="wide"><label>Drug allergies (leave empty if none known)</label><input name="allergies" value="${esc(p.allergies)}"></div>
    </div><div class="row" style="margin-top:12px"><button class="btn">${isNew ? 'Save and write prescription' : 'Save'}</button>${isNew ? '' : '<button type="button" class="btn ghost" id="cancel">Cancel</button>' + (isAdmin() ? '<span style="flex:1"></span><button type="button" class="btn danger" id="delP">Delete patient</button>' : '')}</div></form>`;
  } else {
    h += `<div class="card"><div class="row" style="justify-content:space-between"><div><div class="code" style="font-size:20px">${esc(p.code)}</div><div style="font-size:18px">${esc(p.name)}</div>
      <div class="mut">${[p.sex, p.platoon && 'Platoon ' + p.platoon, p.phone].filter(Boolean).map(esc).join(' · ')}</div></div><button class="btn ghost" id="editP">Edit details</button></div>
      ${p.allergies ? `<div class="allergy">⚠ ALLERGY: ${esc(p.allergies)}</div>` : ''}</div>`;
  }

  if (mode === 'rx') {
    const r = view.rxId ? rxs.find(x => x.id === view.rxId) : null, v = r || { date: today() };
    h += `<form class="card" id="rf"><h2>${r ? 'Edit prescription' : 'New prescription'}</h2><div class="grid">
      <div><label>Date</label><input name="date" type="date" value="${esc(v.date)}" required></div>
      <div class="wide"><label>Diagnosis</label><input name="diagnosis" value="${esc(v.diagnosis)}" required></div>
      <div><label>Prescribed by</label><input name="by" value="${esc(v.by)}"></div>
    </div><div class="row" style="margin-top:12px"><button class="btn">${r ? 'Save' : 'Save and add drugs'}</button><button type="button" class="btn ghost" id="cancel">Cancel</button>${r && isAdmin() ? '<span style="flex:1"></span><button type="button" class="btn danger" id="delRx">Delete prescription</button>' : ''}</div></form>`;
  }
  if (mode === 'drug') {
    const d = view.drugId ? drugs.find(x => x.id === view.drugId) : null, v = d || { times: [], days: '', startDate: today(), startSession: cur };
    h += `<form class="card" id="df"><h2>${d ? 'Edit drug' : 'Add drug to prescription'}</h2><div class="grid">
      <div class="wide"><label>Drug</label><input name="drug" list="drugs" value="${esc(v.drug)}" required autocomplete="off" placeholder="e.g. Tab Paracetamol 500mg"></div>
      <div><label>Dose each time</label><input name="dose" value="${esc(v.dose)}" placeholder="e.g. 2 tabs / 1g"></div>
      <div><label>Number of days</label><input name="days" type="number" min="1" max="60" inputmode="numeric" value="${esc(v.days)}" required></div>
      <div class="wide"><label>When to take it</label><div class="row">${SESS.map(t => `<label class="chk"><input type="checkbox" name="times" value="${t}" ${(v.times || []).includes(t) ? 'checked' : ''}> ${t}</label>`).join('')}</div></div>
      <div><label>First dose date</label><input name="startDate" type="date" value="${esc(v.startDate)}" required></div>
      <div><label>First dose session</label><select name="startSession">${SESS.map((t, i) => `<option value="${i}" ${+v.startSession === i ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="wide" id="tot" style="font-weight:600"></div>
    </div><div class="row" style="margin-top:12px">${d ? '<button class="btn">Save</button><button type="button" class="btn ghost" id="cancel">Cancel</button>' : '<button type="button" class="btn" id="fin">Save and finish</button><button class="btn ghost">Save and add another</button>'}
      ${d ? `<span style="flex:1"></span><button type="button" class="btn ghost" id="stopD">${d.stopped ? 'Restart drug' : 'Stop drug'}</button><button type="button" class="btn danger" id="delD">Delete</button>` : ''}</div></form>`;
  }

  if (!isNew && mode !== 'edit') {
    // what is due this session, and what comes next
    const dueNow = [], doneNow = []; let next = null;
    drugs.forEach(d => { const s = status(p, d); if (s.due) dueNow.push({ d, x: s.due }); if (s.givenNow) doneNow.push({ d, x: s.givenNow }); if (s.next && (!next || cmpSlot(s.next, next.x) < 0)) next = { x: s.next, ds: [] }; });
    if (next) drugs.forEach(d => { const s = status(p, d); if (s.next && cmpSlot(s.next, next.x) === 0) next.ds.push(d); });
    if (drugs.length) h += `<div class="card duec"><h2>${SESS[cur]} — ${dueNow.length ? 'to give now' : doneNow.length ? 'all given' : 'nothing due'}</h2>
      ${dueNow.map(z => `<div class="duer"><span class="drug">${drugName(z.d)}</span><button class="btn" data-give="${z.d.id}">Give</button></div>`).join('')}
      ${doneNow.map(z => `<div class="duer"><span>✓ ${drugName(z.d)}</span><button class="link" data-undo="${z.d.id}">Undo</button></div>`).join('')}
      ${dueNow.length > 1 ? `<div class="row" style="margin-top:10px"><button class="btn" id="giveAll">Give all ${dueNow.length}</button></div>` : ''}
      <div class="nextl">${next ? `<b>Next:</b> ${SESS[next.x.s]} ${dayLabel(next.x.date)} — ${next.ds.map(d => drugName(d)).join(', ')}` : dueNow.length ? 'These are the last doses.' : 'No more doses scheduled.'}</div></div>`;
    const rxCard = (r, open) => {
      const ds = drugs.filter(d => d.rxId === r.id);
      const body = `<div class="mut">Diagnosis</div><div style="margin-bottom:6px">${esc(r.diagnosis) || '—'}${r.by ? ` <span class="mut">· by ${esc(r.by)}</span>` : ''}</div>
        ${ds.length ? ds.map(d => drugCard(p, d)).join('') : '<p class="mut">No drugs on this prescription yet.</p>'}
        <div class="row" style="margin-top:12px"><button class="btn ghost" data-adddrug="${r.id}">+ Add drug</button><button class="link" data-editrx="${r.id}">Edit prescription</button></div>`;
      return open ? `<div class="card"><h2>Current prescription · ${fmtDate(r.date)}</h2>${body}</div>` : `<details class="card"><summary><b>${fmtDate(r.date)}</b> · ${esc(r.diagnosis)} <span class="mut">(${ds.length} drug${ds.length === 1 ? '' : 's'})</span></summary><div style="margin-top:10px">${body}</div></details>`;
    };
    if (mode !== 'rx') h += rxs.length ? rxCard(rxs[0], true) : `<div class="card"><p style="margin-top:0">No prescription yet for this patient.</p></div>`;
    if (!mode) h += `<div class="row" style="margin-bottom:12px"><button class="btn" id="newRx">${rxs.length ? 'New prescription (new visit)' : 'Write prescription'}</button></div>`;
    if (rxs.length > 1) h += `<h2 style="margin:16px 0 8px">Earlier prescriptions</h2>` + rxs.slice(1).map(r => rxCard(r, false)).join('');
    if (p.drugs || p.diagnosis) h += `<div class="note">Old note — ${esc(p.diagnosis || '')} ${esc(p.drugs || '')}</div>`;
  }
  $('#app').innerHTML = h;

  const on = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.onclick = () => fn(el));
  on('#back', () => go({ name: 'home', q: '' }));
  on('#cancel', back);
  on('#editP', () => go({ name: 'patient', id: p.id, mode: 'edit' }));
  on('#newRx', () => go({ name: 'patient', id: p.id, mode: 'rx' }));
  on('[data-editrx]', el => go({ name: 'patient', id: p.id, mode: 'rx', rxId: el.dataset.editrx }));
  on('[data-adddrug]', el => go({ name: 'patient', id: p.id, mode: 'drug', rxId: el.dataset.adddrug }));
  on('[data-editdrug]', el => go({ name: 'patient', id: p.id, mode: 'drug', drugId: el.dataset.editdrug }));
  const byId = id => drugs.find(d => d.id === id);
  on('[data-give]', async el => { const d = byId(el.dataset.give); await setDose(p, d, status(p, d).due, true); render(); });
  on('[data-undo]', async el => { const d = byId(el.dataset.undo); await setDose(p, d, status(p, d).givenNow, false); render(); });
  on('#giveAll', async () => { for (const d of drugs) { const s = status(p, d); if (s.due) await setDose(p, d, s.due, true); } toast('All given'); render(); });
  on('.dot', async el => {
    const d = byId(el.dataset.drug), x = { date: el.dataset.date, s: +el.dataset.s }, label = `${d.drug}, ${SESS[x.s]} ${fmtDate(x.date)}`;
    if (el.classList.contains('up')) return toast('Not due yet: ' + SESS[x.s] + ' ' + dayLabel(x.date));
    if (el.classList.contains('given')) { if (!await ask(`Mark as NOT given? ${label}`, 'Mark not given')) return; await setDose(p, d, x, false); }
    else if (el.classList.contains('missed')) { if (!await ask(`This dose was missed. Mark it as given? ${label}`, 'Mark given')) return; await setDose(p, d, x, true); }
    else await setDose(p, d, x, true);
    render();
  });
  on('#delP', async () => { if (!await ask(`Delete ${p.code} ${p.name} and the whole record?`)) return; p.deleted = true; await saveLocal(p, true); toast('Patient deleted'); go({ name: 'home', q: '' }); });

  const pf = $('#pf');
  if (pf) pf.onsubmit = async ev => {
    ev.preventDefault(); const f = Object.fromEntries(new FormData(pf));
    if (isNew) {
      const batch = norm(f.batch), num = f.num.trim();
      if (!/^\d{2}[A-Z]$/.test(batch)) return toast('The batch should look like 26C: two digits and a letter');
      if (!/^\d{1,4}$/.test(num)) return toast('The number should be up to 4 digits');
      const code = `RV/${batch}/${num.padStart(4, '0')}`, id = norm(code), ex = patients.get(id);
      if (ex && !ex.deleted) return toast(code + ' is already registered');
      p.id = id; p.code = code; if (ex) p.entries = ex.entries || [];
      S.batch = batch; Store.setMeta('settings', S); // remembered, so the next registration starts with the same batch
    }
    Object.assign(p, { name: f.name.trim(), sex: f.sex, platoon: f.platoon.trim(), phone: f.phone.trim(), allergies: f.allergies.trim(), deleted: false });
    await saveLocal(p, true); toast('Patient saved'); go({ name: 'patient', id: p.id, mode: isNew ? 'rx' : '' });
  };
  const rf = $('#rf');
  if (rf) {
    const r = view.rxId ? rxs.find(x => x.id === view.rxId) : null;
    rf.onsubmit = async ev => {
      ev.preventDefault(); const f = Object.fromEntries(new FormData(rf)); for (const k in f) f[k] = f[k].trim();
      let id = r && r.id;
      if (r) Object.assign(r, f, { updatedAt: Date.now() }); else { id = uid(); p.entries.push({ id, t: 'rx', createdAt: Date.now(), updatedAt: Date.now(), ...f }); }
      await saveLocal(p, false); go(r ? { name: 'patient', id: p.id } : { name: 'patient', id: p.id, mode: 'drug', rxId: id });
    };
    on('#delRx', async () => { if (!await ask('Delete this prescription and all its drugs?')) return; const now = Date.now(); r.deleted = true; r.updatedAt = now; drugs.filter(d => d.rxId === r.id).forEach(d => { d.deleted = true; d.updatedAt = now; }); await saveLocal(p, false); back(); });
  }
  const df = $('#df');
  if (df) {
    const d = view.drugId ? byId(view.drugId) : null;
    const read = () => { const fd = new FormData(df); return { drug: fd.get('drug').trim(), dose: fd.get('dose').trim(), days: Math.round(+fd.get('days') || 0), times: fd.getAll('times'), startDate: fd.get('startDate'), startSession: +fd.get('startSession') }; };
    const tot = () => { const v = read(), n = totalOf(v), sl = slots(v); $('#tot').textContent = n ? `Total: ${n} doses. Last dose: ${SESS[sl[sl.length - 1].s]}, ${fmtDate(sl[sl.length - 1].date)}.` : 'Tick when to take it and enter the days to see the total doses.'; };
    df.oninput = tot; tot();
    const save = async another => {
      const v = read();
      if (!v.drug) return toast('Enter the drug name');
      if (!v.times.length) return toast('Tick at least one: Morning, Afternoon or Night');
      if (v.days < 1) return toast('Enter the number of days');
      if (d) Object.assign(d, v, { updatedAt: Date.now() }); else p.entries.push({ id: uid(), t: 'drug', rxId: view.rxId, createdAt: Date.now(), updatedAt: Date.now(), ...v });
      await saveLocal(p, false); refreshDrugs(); toast(d ? 'Drug updated' : v.drug + ' saved' + (another ? ' — add the next drug' : ''));
      go(another ? { name: 'patient', id: p.id, mode: 'drug', rxId: view.rxId } : { name: 'patient', id: p.id });
    };
    df.onsubmit = ev => { ev.preventDefault(); save(!d); };
    // "Save and finish": saves what is typed; if nothing is typed, just closes
    on('#fin', () => { const v = read(); if (!v.drug && !v.times.length && !v.days) back(); else save(false); });
    on('#stopD', async () => {
      if (d.stopped) d.stopped = false;
      else { if (!await ask(`Stop ${d.drug}? Remaining doses will be cancelled.`, 'Stop drug')) return; const s = status(p, d); Object.assign(d, { stopped: true, stopDate: today(), stopSession: nowSess() + (s.givenNow ? 1 : 0) }); }
      d.updatedAt = Date.now(); await saveLocal(p, false); back();
    });
    on('#delD', async () => { if (!await ask(`Delete ${d.drug} from the prescription?`)) return; d.deleted = true; d.updatedAt = Date.now(); await saveLocal(p, false); back(); });
  }
  const fb = $('#pf [name=batch]'), foc = (fb && !fb.value ? fb : null) || $('#pf [name=name]') || $('#rf [name=diagnosis]') || $('#df [name=drug]'); if (foc && !foc.value) foc.focus();
}

function loginForm(title, note) {
  return `<form class="card" id="lf" style="max-width:440px;margin:24px auto"><h2>${title}</h2>
    <div class="fld"><label>Email</label><input name="email" type="text" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" required value="${esc((S.session && S.session.email) || '')}"></div>
    <div class="fld"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div>
    <label class="chk" style="margin-top:10px;border:0;padding:0"><input type="checkbox" id="showpw"> Show password</label>
    <div class="row" style="margin-top:14px"><button class="btn">Sign in</button></div><p class="mut">${note}</p></form>`;
}
function bindLogin(after) {
  $('#showpw').onchange = e => { $('#lf [name=password]').type = e.target.checked ? 'text' : 'password'; };
  $('#lf').onsubmit = async ev => {
    ev.preventDefault(); const f = Object.fromEntries(new FormData($('#lf'))), btn = $('#lf button');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      await signIn({ email: f.email.replace(/\s/g, '').toLowerCase(), password: f.password }, 'password');
      try { await loadMe(); } catch (e) { S.session = null; await Store.setMeta('settings', S); throw e; }
      toast('Signed in as ' + S.me.name); syncError = ''; after(); sync(false);
    } catch (e) {
      toast(e instanceof TypeError ? 'No internet. Signing in needs a connection the first time.' : 'Sign in failed: ' + e.message);
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  };
}
function renderLogin() {
  $('#app').innerHTML = loginForm('Staff sign in', 'Needs internet this once. After that, this phone keeps working offline. No account? Ask the pharmacy admin.');
  bindLogin(() => go({ name: 'home', q: '' })); showStatus();
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
function renderSettings() {
  const n = dirtyCount(), me = S.me || {};
  $('#app').innerHTML = `<div class="row" style="margin-bottom:10px"><button class="btn ghost" id="back">‹ Search</button></div>
  ${S.session.expired ? loginForm('Sign in again to sync', 'Your records are safe on this phone. Sign in to upload them.') : ''}
  <form class="card" id="sf"><h2>Account</h2>
    <p style="margin-top:0">Signed in as <b>${esc(me.name || '')}</b> <span class="mut">${esc(S.session.email || '')}${me.admin ? ' · admin' : ''}</span></p>
    <div class="grid"><div class="wide"><label>Name recorded on each dose you give</label><input name="staff" value="${esc(S.staff)}"></div></div>
    <div class="row" style="margin-top:12px"><button class="btn">Save</button><span style="flex:1"></span><button type="button" class="btn danger" id="out">Sign out</button></div></form>
  ${installEvt ? `<div class="card"><h2>Install</h2><p class="mut">Put the app on the home screen so it opens like an app, even offline.</p><button class="btn" id="inst">Install app</button></div>` : ''}
  <div class="card"><h2>Reports</h2><p class="mut">Statistics and the full record for any period, to view or save as a PDF.</p><button class="btn ghost" id="toRep">Open reports</button></div>
  ${isAdmin() ? `<div class="card" style="border-color:var(--warn)"><h2>End of camp</h2><p class="mut">Deletes every patient record from the cloud and from every phone, ready for the next camp. This cannot be undone. First download the backup below and save the PDF report.</p><button class="btn danger" id="wipe">Delete all records</button></div>` : ''}
  <div class="card"><h2>Backup on this device</h2><p class="mut">Download a copy of all records, or load one from another device (also works for backups from the old Google Sheet version). Loading merges; it never wipes existing records.</p>
    <div class="row"><button class="btn ghost" id="exp">Download backup</button><button class="btn ghost" id="csv">Download as spreadsheet (CSV)</button><label class="btn ghost" style="margin:0;color:var(--g);font-size:16px;border:1px solid var(--g);border-radius:8px;padding:10px 14px;cursor:pointer">Load backup<input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>`;
  $('#back').onclick = () => go({ name: 'home', q: '' });
  if ($('#lf')) bindLogin(() => { S.session.expired = false; render(); });
  $('#sf').onsubmit = async ev => { ev.preventDefault(); S.staff = new FormData($('#sf')).get('staff').trim(); await Store.setMeta('settings', S); toast('Saved'); };
  $('#out').onclick = async () => {
    if (dirtyCount()) return toast(`${n} record${n > 1 ? 's are' : ' is'} not uploaded yet. Sync first, then sign out.`);
    if (!await ask('Sign out? Records will be removed from this phone (they stay safe in the cloud).', 'Sign out')) return;
    try { await sb('/auth/v1/logout', { method: 'POST' }); } catch (e) {}
    patients.clear(); await Store.clearPatients();
    S = { staff: '', lastSync: 0, lastSyncAt: 0, session: null, me: null, backend: S.backend }; await Store.setMeta('settings', S);
    go({ name: 'home', q: '' }); showStatus();
  };
  if ($('#inst')) $('#inst').onclick = async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; render(); };
  const dl = (name, text, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
  $('#toRep').onclick = () => go({ name: 'report' });
  if ($('#wipe')) $('#wipe').onclick = wipeAll;
  $('#exp').onclick = () => { backedUp = true; dl(`pharmacy-backup-${today()}.json`, JSON.stringify([...patients.values()].map(clean)), 'application/json'); };
  $('#csv').onclick = () => {
    const c = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const rows = [['State code', 'Name', 'Sex', 'Platoon', 'Phone', 'Allergies', 'Prescription date', 'Diagnosis', 'Drug', 'Dose', 'When', 'Days', 'Total doses', 'Taken', 'Missed', 'Left', 'Status']];
    live().sort((a, b) => a.id.localeCompare(b.id)).forEach(p => {
      const ds = items(p, 'drug'), base = [p.code, p.name, p.sex, p.platoon, p.phone, p.allergies];
      if (!ds.length) return rows.push(base);
      ds.forEach(d => { const r = items(p, 'rx').find(x => x.id === d.rxId) || {}, s = status(p, d); rows.push([...base, r.date, r.diagnosis, d.drug, d.dose, (d.times || []).join(' / '), d.days, s.total, s.taken, s.missed, s.left, d.stopped ? 'Stopped' : s.left ? 'Ongoing' : 'Finished']); });
    });
    dl(`pharmacy-records-${today()}.csv`, '﻿' + rows.map(r => r.map(c).join(',')).join('\r\n'), 'text/csv');
  };
  $('#imp').onchange = async ev => { const file = ev.target.files[0]; if (!file) return; try { const arr = JSON.parse(await file.text()); if (!Array.isArray(arr)) throw 0; await applyRemote(arr); for (const p of patients.values()) { p._dirty = true; await Store.put(p); } refreshDrugs(); showStatus(); queueSync(); toast(`Backup loaded (${arr.length} records)`); } catch (e) { toast('That file is not a valid backup'); } };
}

let backedUp = false; // set when a backup is downloaded in this session; required before deleting everything
async function wipeAll() {
  if (!navigator.onLine) return toast('This needs internet');
  if (!backedUp) return toast('Download the backup first (button below)');
  await sync(false);
  if (dirtyCount() || syncError) return toast('Could not sync this phone first. Try again when the connection is better.');
  const n = live().length;
  if (!await askTyped(`Delete all ${n} patient record${n === 1 ? '' : 's'} for good, from the cloud and every phone? Records not yet uploaded from other phones will be lost.`, 'DELETE', 'Delete everything')) return;
  try {
    const ts = await sb('/rest/v1/rpc/wipe_all', { method: 'POST', body: JSON.stringify({ confirm: 'DELETE' }) });
    patients.clear(); await Store.clearPatients(); S.epoch = +ts; S.lastSync = 0; await Store.setMeta('settings', S);
    backedUp = false; refreshDrugs(); toast('All records deleted'); go({ name: 'home', q: '' });
  } catch (e) { toast('Could not delete: ' + (e instanceof TypeError ? 'cannot reach the server' : e.message)); }
}

/* ---------- reports ---------- */
// Everything in a report is chosen by prescription date: a visit counts if its prescription is dated inside the period.
function reportData(from, to) {
  const rows = [], ids = new Set();
  live().forEach(p => items(p, 'rx').filter(r => r.date >= from && r.date <= to).forEach(r => {
    ids.add(p.id); rows.push({ p, r, ds: items(p, 'drug').filter(d => d.rxId === r.id).map(d => ({ d, s: status(p, d) })) });
  }));
  rows.sort((a, b) => a.r.date.localeCompare(b.r.date) || a.p.id.localeCompare(b.p.id));
  const count = (list, key) => { const m = new Map(); list.forEach(x => { const k = String(key(x) || '').trim(); if (!k) return; const e = m.get(k.toLowerCase()) || { label: k, n: 0 }; e.n++; m.set(k.toLowerCase(), e); }); return [...m.values()].sort((a, b) => b.n - a.n || a.label.localeCompare(b.label)); };
  const people = [...ids].map(id => patients.get(id)), all = rows.flatMap(x => x.ds), sum = k => all.reduce((n, x) => n + x.s[k], 0);
  return { rows, patients: people.length, visits: rows.length, drugs: all.length, taken: sum('taken'), missed: sum('missed'), left: sum('left'),
    allergy: people.filter(p => p.allergies).length, dx: count(rows, x => x.r.diagnosis), top: count(all, x => x.d.drug),
    sex: count(people, p => ({ M: 'Male', F: 'Female' })[p.sex] || 'Not recorded'), platoon: count(people, p => p.platoon ? 'Platoon ' + p.platoon : 'Not recorded'),
    days: count(rows, x => x.r.date).sort((a, b) => a.label.localeCompare(b.label)) };
}
function renderReport() {
  const dates = live().flatMap(p => items(p, 'rx').map(r => r.date)).filter(Boolean).sort();
  if (!view.from) view.from = dates[0] || today();
  if (!view.to) view.to = today();
  const from = view.from <= view.to ? view.from : view.to, to = view.from <= view.to ? view.to : view.from;
  const R = reportData(from, to), pct = R.taken + R.missed ? Math.round(100 * R.taken / (R.taken + R.missed)) + '%' : '—';
  const tbl = (title, list, head) => `<div><h3>${title}</h3>${list.length ? `<table><tr><th>${head}</th><th style="text-align:right">Number</th></tr>${list.map(x => `<tr><td>${esc(x.label)}</td><td style="text-align:right">${x.n}</td></tr>`).join('')}</table>` : '<p class="mut">None</p>'}</div>`;
  $('#app').innerHTML = `<div class="row noprint" style="margin-bottom:10px"><button class="btn ghost" id="back">‹ Search</button></div>
    <div class="card noprint"><h2>Report period</h2><div class="grid"><div><label>From</label><input type="date" id="rf1" value="${esc(view.from)}"></div><div><label>To</label><input type="date" id="rf2" value="${esc(view.to)}"></div></div>
      <div class="row" style="margin-top:12px"><button class="btn" id="pdf">Save as PDF / Print</button><span class="mut">In the next screen choose “Save as PDF”.</span></div></div>
    <div class="card"><h2 style="font-size:18px;margin-bottom:2px">Nonwa Gbam NYSC Camp Pharmacy</h2><div><b>Records report: ${fmtDate(from)} to ${fmtDate(to)}</b></div>
      <div class="mut">Prepared ${fmtDate(today())}${S.staff ? ' by ' + esc(S.staff) : ''} · counted by prescription date</div>
      <div class="tiles"><div><b>${R.patients}</b>patients seen</div><div><b>${R.visits}</b>prescriptions</div><div><b>${R.drugs}</b>drugs prescribed</div><div><b>${R.taken}</b>doses given</div><div><b>${R.missed}</b>doses missed</div><div><b>${R.left}</b>doses still to come</div><div><b>${pct}</b>of due doses given</div><div><b>${R.allergy}</b>patients with an allergy</div></div>
      <div class="two">${tbl('Diagnoses', R.dx, 'Diagnosis')}${tbl('Drugs prescribed', R.top, 'Drug')}${tbl('Patients by sex', R.sex, 'Sex')}${tbl('Patients by platoon', R.platoon, 'Platoon')}${tbl('Prescriptions per day', R.days.map(x => ({ label: fmtDate(x.label), n: x.n })), 'Date')}</div>
      <h3>Full record</h3>${R.rows.length ? `<div class="scroll"><table><tr><th>Date</th><th>Patient</th><th>Diagnosis</th><th>Drugs and doses</th></tr>${R.rows.map(x => `<tr><td style="white-space:nowrap">${fmtDate(x.r.date)}</td>
        <td><b>${esc(x.p.code)}</b><br>${esc(x.p.name)}<br><span class="mut">${[x.p.sex, x.p.platoon && 'Platoon ' + x.p.platoon, x.p.phone].filter(Boolean).map(esc).join(' · ')}</span>${x.p.allergies ? `<br><span style="color:var(--warn)">Allergy: ${esc(x.p.allergies)}</span>` : ''}</td>
        <td>${esc(x.r.diagnosis)}${x.r.by ? `<br><span class="mut">by ${esc(x.r.by)}</span>` : ''}</td>
        <td>${x.ds.map(z => `${esc(z.d.drug)}${z.d.dose ? ' ' + esc(z.d.dose) : ''} <span class="mut">(${timesOf(z.d).map(i => SESS[i]).join('/')} × ${esc(z.d.days)} day${z.d.days == 1 ? '' : 's'})</span><br><span class="mut">given ${z.s.taken} of ${z.s.total}${z.s.missed ? ', missed ' + z.s.missed : ''}${z.d.stopped ? ', stopped' : z.s.left ? ', ongoing' : ', finished'}</span>`).join('<br>') || '<span class="mut">No drugs</span>'}</td></tr>`).join('')}</table></div>` : '<p class="mut">No prescriptions in this period.</p>'}
    </div>`;
  $('#back').onclick = () => go({ name: 'home', q: '' });
  $('#rf1').onchange = e => { if (e.target.value) { view.from = e.target.value; render(); } };
  $('#rf2').onchange = e => { if (e.target.value) { view.to = e.target.value; render(); } };
  $('#pdf').onclick = () => { const t = document.title; document.title = `Pharmacy report ${from} to ${to}`; window.print(); setTimeout(() => { document.title = t; }, 1000); };
}

/* ---------- start ---------- */
$('#home').onclick = () => go({ name: 'home', q: '' });
$('#syncBtn').onclick = () => sync(true);
$('#setBtn').onclick = () => go({ name: S.session ? 'settings' : 'home' });
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data === 'update') $('#upd').hidden = false; });
}
$('#upd').onclick = () => location.reload();
(async () => {
  await Store.open();
  (await Store.all()).forEach(p => patients.set(p.id, p));
  S = Object.assign(S, (await Store.getMeta('settings')) || {});
  if (S.backend !== 'supabase') { // first start after moving from Google Sheets: upload everything to the new database
    delete S.url; delete S.key; S.backend = 'supabase'; S.lastSync = 0;
    for (const p of patients.values()) { p._dirty = true; await Store.put(p); }
    await Store.setMeta('settings', S);
  }
  refreshDrugs(); render(); showStatus(); sync(false);
  setTimeout(hideSplash, Math.max(0, 1700 - performance.now())); // show the loading page for a moment, then the app
  if (S.session && !S.session.expired && navigator.onLine) loadMe().catch(() => {});
})();
</script>
