# Builds the Android app (android/) and publishes it at a fixed download link:
# https://github.com/automateeaseai-arch/Nonwa-gbam-camp-pharmacy/releases/download/android-app/CampPharmacy.apk
# Only needed when android/ changes: the app loads the website, so website updates reach it without a new APK.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # A signing key is required to install an APK. It is made fresh on the build machine and never stored,
      # so nothing secret lives in this public repository. (A new key means a new build cannot install over an
      # older one: uninstall the old app first. Records are safe in the cloud once synced.)
      - name: Make signing key
        run: |
          echo "APK_KEY_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "APK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Create keystore
        run: |
          keytool -genkeypair -v -keystore "$APK_KEYSTORE" -alias camppharmacy -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$APK_KEY_PASSWORD" -keypass "$APK_KEY_PASSWORD" -dname "CN=Camp Pharmacy"

      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk CampPharmacy.apk
          gh release delete android-app --yes --cleanup-tag || true
          gh release create android-app CampPharmacy.apk --target "${{ github.sha }}" --latest \
            --title "Camp Pharmacy Android app" \
            --notes "Download CampPharmacy.apk on the tablet or phone and open it to install. Built from ${{ github.sha }}."
